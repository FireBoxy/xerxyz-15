  function loadFavorites(){try{return JSON.parse(localStorage.getItem(FAVORITES_STORAGE)||'[]')}catch(_){return[]}}

  function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

  function normalizeSearchText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
  function rankMusicResults(items,query){
    const queryText=normalizeSearchText(query),queryWords=queryText.split(/\s+/).filter(word=>word.length>1);
    const excluded=/\b(reaction|reacts|remix(?:es|ed)?|lyrics?|cover(?:s|ed)?|music video|official video|karaoke|nightcore|slowed|sped up|8d|mashup|tutorial|review|explained|instrumental|fan made)\b/i;
    const ranked=items.filter(item=>item&&item.id&&!excluded.test((item.title||'')+' '+(item.channel||'')+' '+(item.artist||''))).map(item=>{
      const title=normalizeSearchText(item.title),channel=normalizeSearchText(item.channel||item.artist),combined=title+' '+channel;
      const matchedWords=queryWords.filter(word=>combined.includes(word)).length;
      let score=queryWords.length?matchedWords/queryWords.length*35:0;
      if(title===queryText)score+=100;
      else if(title.includes(queryText))score+=55;
      if(/\bofficial audio\b|\baudio\b/i.test(item.title||''))score+=70;
      if(/\bprovided to youtube by\b/i.test(item.title||''))score+=45;
      if(/\btopic\b/i.test(item.channel||''))score+=35;
      if(/\bofficial\b/i.test(item.title||''))score+=15;
      return{item,score,audio:/\bofficial audio\b|\baudio\b|\btopic\b|\bprovided to youtube by\b/i.test((item.title||'')+' '+(item.channel||''))};
    }).sort((a,b)=>b.score-a.score);
    if(ranked.some(result=>result.audio)){
      const audioResults=ranked.filter(result=>result.audio);
      return audioResults.slice(0,SEARCH_RESULT_LIMIT).map(result=>result.item);
    }
    return ranked.slice(0,SEARCH_RESULT_LIMIT).map(result=>result.item);
  }
  function init(){

  function setHeadingActions(markup=''){let actions=document.getElementById('music-heading-actions');if(!actions){actions=document.createElement('div');actions.id='music-heading-actions';actions.className='music-heading-actions';document.querySelector('.music-heading').appendChild(actions)}actions.innerHTML=markup}
  function showCatalog(){activePlaylistId=null;results=CATALOG.slice();queue=results.slice();document.getElementById('music-heading-title').textContent='Your music';document.getElementById('music-heading-subtitle').textContent='Curated mixes and listening moods';setHeadingActions('');renderResults(results);setStatus(results.length+' albums ready')}
  function showQueue(){activePlaylistId=null;results=queue.slice();document.getElementById('music-heading-title').textContent='Up next';document.getElementById('music-heading-subtitle').textContent='Your playback queue';setHeadingActions('<button class="music-heading-action" type="button" data-action="shuffle-queue">↝ Shuffle queue</button><button class="music-heading-action" type="button" data-action="clear-queue">Clear queue</button>');document.querySelector('[data-action="shuffle-queue"]').addEventListener('click',()=>{shuffleEnabled=true;updateShuffleButton();if(queue.length>1){const current=queue[currentIndex];const rest=queue.filter((_,i)=>i!==currentIndex).sort(()=>Math.random()-.5);queue=current?[current,...rest]:rest;currentIndex=current?0:-1}showQueue();setStatus('Queue shuffled.')});document.querySelector('[data-action="clear-queue"]').addEventListener('click',()=>{queue=[];currentIndex=-1;showQueue();setStatus('Queue cleared.')});renderResults(results,'queue');setStatus(results.length?results.length+' tracks in your queue':'Your queue is empty.')}
  function renderPlaylists(){const list=document.getElementById('music-playlist-list');if(!list)return;list.innerHTML=playlists.map(playlist=>{const tracks=playlist.tracks.slice(0,4);const cover=tracks.length?`<span class="music-playlist-cover ${tracks.length===1?'single':''}">${tracks.map(track=>`<img src="${escapeHtml(track.thumbnail||'')}" alt="" loading="lazy">`).join('')}</span>`:'<span class="music-playlist-cover empty">♫</span>';return `<button class="music-playlist-item" type="button" data-playlist-id="${escapeHtml(playlist.id)}" aria-label="${escapeHtml(playlist.name)}" title="${escapeHtml(playlist.name)}">${cover}<span class="music-playlist-name">${escapeHtml(playlist.name)}</span></button>`}).join('');list.querySelectorAll('[data-playlist-id]').forEach(button=>button.addEventListener('click',()=>showPlaylist(button.dataset.playlistId)))}
  function openPlaylistNameDialog(playlistId=null){const playlist=playlistById(playlistId);const content=document.getElementById('music-dialog-content');content.innerHTML=`<h2 id="music-dialog-title">${playlist?'Rename playlist':'Create a playlist'}</h2><p>${playlist?'Choose a new name for this playlist.':'Give your new playlist a name to get started.'}</p><form id="playlist-name-form"><input type="text" name="name" maxlength="60" placeholder="Playlist name" value="${escapeHtml(playlist?.name||'')}" required><div class="music-dialog-actions"><button type="button" data-dialog-cancel>Cancel</button><button type="submit">${playlist?'Save name':'Create playlist'}</button></div></form>`;const dialog=document.getElementById('music-dialog');dialog.showModal();content.querySelector('[data-dialog-cancel]').addEventListener('click',()=>dialog.close());content.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const name=new FormData(event.currentTarget).get('name').trim();if(!name)return;if(playlist){playlist.name=name;savePlaylists();renderPlaylists();dialog.close();showPlaylist(playlist.id);setStatus('Playlist renamed.')}else{const created={id:crypto.randomUUID?crypto.randomUUID():'playlist-'+Date.now(),name,tracks:[]};playlists.push(created);savePlaylists();renderPlaylists();dialog.close();showPlaylist(created.id);setStatus('Playlist created.')}});content.querySelector('input').focus()}
  function showPlaylist(id){const playlist=playlistById(id);if(!playlist)return;activePlaylistId=id;queue=playlist.tracks.slice();results=queue.slice();currentIndex=-1;document.getElementById('music-heading-title').textContent=playlist.name;document.getElementById('music-heading-subtitle').textContent=playlist.tracks.length+' songs · Playlist';setHeadingActions('<button class="music-heading-action" type="button" data-action="shuffle-playlist">↝ Shuffle</button><button class="music-heading-action" type="button" data-action="rename-playlist">Rename</button><button class="music-heading-action" type="button" data-action="delete-playlist">Delete</button>');document.querySelector('[data-action="shuffle-playlist"]').addEventListener('click',()=>{queue=playlist.tracks.slice().sort(()=>Math.random()-.5);results=queue.slice();shuffleEnabled=true;updateShuffleButton();renderResults(results,'playlist');setStatus('Playlist shuffled.')});document.querySelector('[data-action="rename-playlist"]').addEventListener('click',()=>openPlaylistNameDialog(id));document.querySelector('[data-action="delete-playlist"]').addEventListener('click',()=>{if(!window.confirm('Delete “'+playlist.name+'”?'))return;playlists=playlists.filter(item=>item.id!==id);savePlaylists();renderPlaylists();showCatalog();setStatus('Playlist deleted.')});renderResults(results,'playlist');setStatus(playlist.tracks.length?playlist.tracks.length+' songs in this playlist.':'Add songs using the + Playlist button.')}
  function openAddToPlaylists(track){const content=document.getElementById('music-dialog-content');content.innerHTML=`<h2 id="music-dialog-title">Add to playlist</h2><p>${escapeHtml(track.title)}</p><form id="add-track-form"><div class="music-dialog-list">${playlists.length?playlists.map(list=>`<label class="music-dialog-option"><input type="checkbox" name="playlist" value="${escapeHtml(list.id)}" ${list.tracks.some(item=>item.id===track.id)?'checked':''}><span>${escapeHtml(list.name)}</span></label>`).join(''):'<p>No playlists yet. Create one below.</p>'}</div><input type="text" name="newPlaylist" maxlength="60" placeholder="Or create a new playlist"><div class="music-dialog-actions"><button type="button" data-dialog-cancel>Cancel</button><button type="submit">Save</button></div></form>`;const dialog=document.getElementById('music-dialog');dialog.showModal();content.querySelector('[data-dialog-cancel]').addEventListener('click',()=>dialog.close());content.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget);const selected=form.getAll('playlist');let added=0;selected.forEach(id=>{const list=playlistById(id);if(list&&!list.tracks.some(item=>item.id===track.id)){list.tracks.push(track);added++}});const newName=String(form.get('newPlaylist')||'').trim();if(newName){playlists.push({id:crypto.randomUUID?crypto.randomUUID():'playlist-'+Date.now(),name:newName,tracks:[track]});added++}savePlaylists();renderPlaylists();dialog.close();setStatus(added?'Added to '+added+' playlist'+(added===1?'':'s')+'.':'Already saved in selected playlists.')})}
  function addToQueue(track){queue.push(track);setStatus('Added to queue. '+queue.length+' tracks up next.')}
  function removeFromPlaylist(trackId){const list=playlistById(activePlaylistId);if(!list)return;const index=list.tracks.findIndex(track=>track.id===trackId);if(index<0)return;list.tracks.splice(index,1);savePlaylists();renderPlaylists();showPlaylist(list.id);setStatus('Removed from playlist.')}
  function removeFromQueue(index){queue.splice(index,1);if(index<currentIndex)currentIndex--;else if(index===currentIndex)currentIndex=-1;showQueue();setStatus('Removed from queue.')}
  function toggleShuffle(){shuffleEnabled=!shuffleEnabled;updateShuffleButton();if(shuffleEnabled&&queue.length>1){const current=queue[currentIndex];const rest=queue.filter((_,i)=>i!==currentIndex).sort(()=>Math.random()-.5);queue=current?[current,...rest]:rest;currentIndex=current?0:-1}setStatus(shuffleEnabled?'Shuffle is on.':'Shuffle is off.')}

  async function getSearchInstances(){try{const response=await fetch(SEARCH_DIRECTORY,{cache:'no-store'});if(response.ok){const entries=await response.json();const discovered=entries.flatMap(entry=>Array.isArray(entry)&&entry[1]?.api===true&&entry[1]?.cors===true?['https://'+entry[0]]:[]);if(discovered.length)return ['https://yt.chocolatemoo53.com',...new Set(discovered),...FALLBACK_INSTANCES.map(domain=>'https://'+domain)]}}catch(_){return[]}return FALLBACK_INSTANCES.map(domain=>'https://'+domain)}
  async function search(query){
    const cleanQuery=String(query||'').trim();
    if(!cleanQuery)return showCatalog();
    activePlaylistId=null;
    setHeadingActions('');
    document.getElementById('music-heading-title').textContent='Search results';
    document.getElementById('music-heading-subtitle').textContent=cleanQuery;
    setStatus('Searching for official song audio…');
    let apiError='',apiKey=YOUTUBE_API_KEY;
    const useMatches=(matches,source)=>{
      if(!matches.length)return false;
      results=matches;
      queue=results;
      currentIndex=-1;
      renderResults(results);
      setStatus(results.length+' song results'+(source?' from '+source:'')+'.');
      return true;
    };
    if(apiKey){
      try{
        const params=new URLSearchParams({part:'snippet',type:'video',videoCategoryId:'10',maxResults:'50',q:cleanQuery+' official audio',key:apiKey});
        const response=await fetch('https://www.googleapis.com/youtube/v3/search?'+params.toString(),{headers:{Accept:'application/json'},cache:'no-store'});
        if(!response.ok)throw new Error('YouTube API request failed ('+response.status+').');
        const payload=await response.json();
        const videos=(payload.items||[]).map(item=>{
          const snippet=item.snippet||{},videoId=item.id?.videoId;
          return videoId?{id:videoId,title:snippet.title||'Untitled track',channel:snippet.channelTitle||'YouTube Music',artist:snippet.channelTitle||'YouTube Music',thumbnail:snippet.thumbnails?.high?.url||snippet.thumbnails?.medium?.url||'https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg',genre:'youtube music'}:null;
        }).filter(Boolean);
        if(useMatches(rankMusicResults(videos,cleanQuery),'YouTube'))return;
      }catch(error){apiError=error.message||'YouTube API is unavailable.'}
    }
    const instances=await getSearchInstances();
    for(const instance of instances){
      try{
        const params=new URLSearchParams({q:cleanQuery+' official audio',type:'video',page:'1'});
        const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),9000);
        let response;
        try{response=await fetch(instance+'/api/v1/search?'+params.toString(),{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal})}
        finally{clearTimeout(timeout)}
        if(!response.ok)continue;
        const items=await response.json();
        const videos=items.filter(item=>item?.type==='video'||item?.videoId).map(item=>{
          const videoId=item.videoId||item.video_id||item.id;
          return{id:videoId,title:item.title||'Untitled track',channel:item.author||item.uploaderName||'YouTube Music',artist:item.author||item.uploaderName||'YouTube Music',thumbnail:'https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg',genre:'youtube music'};
        }).filter(item=>item.id);
        if(useMatches(rankMusicResults(videos,cleanQuery),'public YouTube search'))return;
      }catch(_){}
    }
    const localMatches=rankMusicResults(CATALOG.filter(track=>(track.title+' '+track.channel+' '+track.genre).toLowerCase().includes(cleanQuery.toLowerCase())),cleanQuery);
    results=localMatches;
    queue=results;
    renderResults(results);
    setStatus(apiError?'YouTube search failed; '+(localMatches.length?'showing matches from the local mix.':'no search provider responded.'):localMatches.length?'Showing matches from the local mix.':'No official song audio found. Try another search.');
  }
  function renderResults(items,mode='browse'){const grid=document.getElementById('music-grid');grid.innerHTML=items.map((item,index)=>`<article class="music-card"><button class="music-card-main" type="button" data-music-index="${index}" aria-label="Play ${escapeHtml(item.title)}"><span class="music-card-art"><img src="${escapeHtml(item.thumbnail)}" alt="${escapeHtml(item.title)} cover" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${escapeHtml(item.id)}/mqdefault.jpg'"><span class="music-card-play">▶</span></span><span class="music-card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span><span class="music-card-meta" title="${escapeHtml(item.artist||item.channel)}">${escapeHtml(item.artist||item.channel)}</span></button><div class="music-card-actions">${mode==='playlist'?`<button class="music-card-action" type="button" data-action="remove-playlist" data-index="${index}">− Remove</button>`:mode==='queue'?`<button class="music-card-action" type="button" data-action="remove-queue" data-index="${index}">− Remove</button>`:`<button class="music-card-action" type="button" data-action="add-playlist" data-index="${index}">＋ Playlist</button>`}${mode!=='queue'?`<button class="music-card-action" type="button" data-action="add-queue" data-index="${index}">≡ Queue</button>`:''}</div></article>`).join('');grid.querySelectorAll('[data-music-index]').forEach(card=>card.addEventListener('click',()=>playAt(Number(card.dataset.musicIndex))));grid.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.index);if(button.dataset.action==='add-playlist')openAddToPlaylists(items[index]);else if(button.dataset.action==='add-queue')addToQueue(items[index]);else if(button.dataset.action==='remove-playlist')removeFromPlaylist(items[index].id);else if(button.dataset.action==='remove-queue')removeFromQueue(index)}))}
  function showFavorites(){activePlaylistId=null;setHeadingActions('');queue=favorites.slice();results=queue;document.getElementById('music-heading-title').textContent='Favorites';document.getElementById('music-heading-subtitle').textContent='Saved tracks from this browser';renderResults(queue);setStatus(queue.length?queue.length+' saved tracks':'No favorites yet.')}
  function setStatus(message){document.getElementById('music-status').textContent=message}
  function toggleFavorite(){const track=queue[currentIndex];if(!track)return;const existing=favorites.findIndex(item=>item.id===track.id);if(existing>=0)favorites.splice(existing,1);else favorites.unshift(track);saveFavorites();updateFavoriteButton();setStatus(existing>=0?'Removed from favorites.':'Added to favorites.')}
  function updateFavoriteButton(){const track=queue[currentIndex],button=document.getElementById('music-favorite'),active=!!track&&favorites.some(item=>item.id===track.id);button.textContent=active?'♥':'♡';button.setAttribute('aria-label',active?'Remove from favorites':'Favorite track')}
  function loadYouTubeApi(){if(window.YT?.Player)return;window.onYouTubeIframeAPIReady=()=>createPlayer();if(!document.querySelector('script[data-youtube-api]')){const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.dataset.youtubeApi='true';document.head.appendChild(script)}}
  function createPlayer(){if(player)return;player=new window.YT.Player('music-youtube-player',{width:'1',height:'1',playerVars:{autoplay:0,controls:0,playsinline:1},events:{onReady:()=>player.setVolume(Number(document.getElementById('music-volume').value)),onStateChange:state=>{const button=document.getElementById('music-play');if(state.data===window.YT.PlayerState.PLAYING){button.textContent='Ⅱ';button.setAttribute('aria-label','Pause');startProgressTimer()}else if(state.data===window.YT.PlayerState.PAUSED){button.textContent='▶';button.setAttribute('aria-label','Play')}else if(state.data===window.YT.PlayerState.ENDED){if(repeatEnabled)playAt(currentIndex);else playNext()}}}})}
  function playAt(index){if(!queue.length)return;currentIndex=(index+queue.length)%queue.length;const track=queue[currentIndex];document.getElementById('music-track-title').textContent=track.title;document.getElementById('music-track-channel').textContent=track.artist||track.channel;document.getElementById('music-track-art').src=track.thumbnail;document.getElementById('music-track-art').alt=track.title;updateFavoriteButton();if(!window.YT?.Player||!player){createPlayer();setStatus('Loading player…');return}player.loadVideoById(track.id)}
  function togglePlay(){if(!player?.playVideo)return;const state=player.getPlayerState();if(state===window.YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo()}
  function startProgressTimer(){if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(()=>{if(!player?.getDuration)return;const duration=player.getDuration()||0,elapsed=player.getCurrentTime()||0;document.getElementById('music-progress').value=duration?String(Math.round(elapsed/duration*100)):'0'},500)}
  init();
})();
</script>
